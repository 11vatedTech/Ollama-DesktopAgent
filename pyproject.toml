[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "11vated-ollama-workstation"
version = "0.2.0.dev0"
description = "A local-first desktop agent workstation that profiles Ollama models and turns them into operational agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "11vatedTech" }]
dependencies = ["httpx>=0.27,<1", "platformdirs>=4.2,<5", "jsonschema>=4.23,<5", "cryptography>=43,<51"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.7,<7"]
mcp = ["mcp>=2,<3"]
# Isolated browser (drives the installed Edge/Chrome) and Windows UI Automation.
interaction = ["playwright>=1.48,<2", "uiautomation>=2.0.20,<3; sys_platform == 'win32'"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2",
       "types-jsonschema", "types-pywin32; sys_platform == 'win32'"]

[project.scripts]
11vated = "ollama_workstation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_workstation"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
