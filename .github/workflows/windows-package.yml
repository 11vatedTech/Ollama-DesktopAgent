name: Windows package
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]" pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name 11vated-Intelligence --paths src --collect-all PySide6 --collect-all shiboken6 src/ollama_workstation/__main__.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: 11vated-Intelligence-Windows
          path: dist/11vated-Intelligence/
          if-no-files-found: error
