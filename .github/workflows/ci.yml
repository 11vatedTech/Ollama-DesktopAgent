name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=ollama_workstation --cov-report=xml
      - name: Desktop import (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install -e ".[desktop]"
          python -c "from ollama_workstation.ui.main_window import MainWindow; print('Qt desktop import OK')"
